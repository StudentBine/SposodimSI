services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: sposodimsi
      POSTGRES_PASSWORD: sposodimsi
      POSTGRES_DB: sposodimsi
    ports:
      - "5432:5432"
    volumes:
      - ./backend/db:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql

volumes:
  db-data: